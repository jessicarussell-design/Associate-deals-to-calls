name: Associate calls to deals

on:
  schedule:
    # 19:00 UTC = 6:00am Melbourne in daylight time (Oct-Apr), 5:00am otherwise.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only, make no changes in HubSpot"
        type: boolean
        default: true

jobs:
  associate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Associate yesterday's calls
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OWN_PHONE_NUMBERS: ${{ vars.OWN_PHONE_NUMBERS }}
          # Scheduled runs make changes only once the LIVE_MODE variable is "true".
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || vars.LIVE_MODE != 'true' }}
          REPORT_PATH: report.csv
        run: python associate_calls.py | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: call-deal-report-${{ github.run_id }}
          path: report.csv
          retention-days: 30
